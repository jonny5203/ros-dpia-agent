# Runtime nginx config for the `web` service (serves the built SPA + proxies).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;  # document uploads (Phase 2)

    # The BFF session cookie holds 3 JWTs (access + refresh + ID) → the
    # Set-Cookie response header can exceed nginx's 4K default. Lift the
    # header buffer so /auth/callback's 307 + cookie isn't rejected as 502.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # ── API reverse proxy (same origin → cookie auth, no CORS) ────────────
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # SSE-friendly for the streaming chat (Phase 4+)
        proxy_buffering off;
        proxy_cache off;
    }

    # ── BFF auth endpoints (same upstream as /api/, separate prefix) ──────
    # /auth/{login,callback,logout,me} live on FastAPI outside the /api
    # router, so they need their own proxy block — otherwise they fall through
    # to the SPA fallback and return index.html instead of the 302/JSON.
    location /auth/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── SPA client-side routing fallback ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
