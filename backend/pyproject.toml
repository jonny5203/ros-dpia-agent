[project]
name = "dpia-ros-backend"
version = "0.1.0"
description = "Kommune DPIA & ROS Copilot — FastAPI backend"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  # --- Phase 0: enough to boot, serve /api/health, run the arq worker, talk to OpenRouter ---
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "arq>=0.26",
  "redis>=5.0",
  "pyjwt[crypto]>=2.9",
  "itsdangerous>=2.2",
  # --- Phase 1+ (added when the phase that needs them lands) -------------------
  # Phase 1 (auth/rbac):     (deps above; pyjwt for JWKS validation, itsdangerous for cookie signing)
  # Phase 2 (storage):       "aioboto3>=13"
  # Phase 2/3 (db/migrations): "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "alembic>=1.13"
  # Phase 3 (ingestion/vec): "qdrant-client>=1.12", "PyMuPDF4LLM>=0.0.17", "python-docx>=1.1",
  #                          "openpyxl>=3.1", "presidio-analyzer>=2.2", "tiktoken>=0.7"
  # Phase 4+ (LLM):          "instructor>=1.4"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["B011"]

# ── mypy (lenient for the skeleton; tighten per-phase as modules fill in) ────
[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-q"
