[project]
name = "dpia-ros-backend"
version = "0.1.0"
description = "Kommune DPIA & ROS Copilot — FastAPI backend"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "arq>=0.26",
  "redis>=5.0",
  "pyjwt[crypto]>=2.9",
  "itsdangerous>=2.2",
  "aioboto3>=13",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.18",
  "qdrant-client>=1.18",
  "docling-slim[feat-ocr-rapidocr-onnx,format-pdf,models-local]>=2.111.0,<3",
  "pypdf>=6.14.2,<7",
  "torch>=2.9,<3",
  "torchvision>=0.24,<1",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "presidio-analyzer>=2.2",
  "tiktoken>=0.7",
  "instructor>=1.4",
  "python-multipart>=0.0.32",
  "langchain>=1.3.14",
  "langchain-text-splitters>=1.1.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "reportlab>=4.0",
  "httpx2==2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["B011"]

# ── mypy (lenient for the skeleton; tighten per-phase as modules fill in) ────
[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-q"
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
