# FastAPI — the API. Loads all .env values from the dpia-secrets Secret via envFrom,
# then overrides the browser-facing URLs (which differ from the docker setup
# because the web app is now on host port 8081). In-cluster service hostnames
# (postgres, qdrant, redis, minio, keycloak) resolve unchanged via in-namespace
# DNS, so DATABASE_URL / QDRANT_URL / REDIS_URL / MINIO_ENDPOINT / KEYCLOAK_URL
# from .env work as-is.
#
# `env:` entries take precedence over `envFrom:` per Kubernetes spec, so the
# explicit overrides below win over any same-named key in the Secret.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: dpia-ros-backend:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          command: ["/usr/bin/tini", "--"]
          args:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --proxy-headers
            - --forwarded-allow-ips=*
          envFrom:
            - secretRef: { name: dpia-secrets }
          env:
            # Browser-facing origin: Keycloak has its own NodePort (8082), so
            # browser OIDC redirects point there directly (no /oidc prefix).
            - name: KEYCLOAK_PUBLIC_URL
              value: http://localhost:8082
            # The SPA + BFF are on 8081 (nginx NodePort); Keycloak redirects
            # back here after login. Default in .env is http://localhost (no
            # port) which breaks the callback redirect_uri.
            - name: PUBLIC_BASE_URL
              value: http://localhost:8081
            - name: CORS_ORIGINS
              value: http://localhost:8081
            # In-cluster, requests come from any pod IP — accept all forwarded.
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            # In-cluster, requests come from any pod IP — accept all forwarded.
            - name: FORWARDED_ALLOW_IPS
              value: "*"
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
